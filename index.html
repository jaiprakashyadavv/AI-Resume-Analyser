<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeAI - Beat the ATS. Land the Interview.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#b9dffe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              800: '#1e40af',
              900: '#0f172a', // Deep slate primary
              950: '#020617',
            }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2s linear infinite',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel Standalone for direct in-browser execution -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow {
      animation: spin-slow 12s linear infinite;
    }
    /* Custom scrollbars */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 selection:bg-blue-600 selection:text-white min-h-screen flex flex-col">
  <div id="root"></div>

  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- Lucide Icons as Crisp SVG Components ---
    const Icon = ({ path, className = "w-5 h-5", ...props }) => (
      <svg
        className={className}
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        strokeWidth="2"
        strokeLinecap="round"
        strokeLinejoin="round"
        {...props}
      >
        {path}
      </svg>
    );

    const SparklesIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/>
          <path d="M5 3v4"/>
          <path d="M19 17v4"/>
          <path d="M3 5h4"/>
          <path d="M17 19h4"/>
        </>
      }/>
    );

    const UploadCloudIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/>
          <path d="M12 12v9"/>
          <path d="m16 16-4-4-4 4"/>
        </>
      }/>
    );

    const FileTextIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/>
          <path d="M14 2v4a2 2 0 0 0 2 2h4"/>
          <path d="M10 9H8"/>
          <path d="M16 13H8"/>
          <path d="M16 17H8"/>
        </>
      }/>
    );

    const CheckCircleIcon = (props) => (
      <Icon {...props} path={
        <>
          <circle cx="12" cy="12" r="10"/>
          <path d="m9 12 2 2 4-4"/>
        </>
      }/>
    );

    const XCircleIcon = (props) => (
      <Icon {...props} path={
        <>
          <circle cx="12" cy="12" r="10"/>
          <path d="m15 9-6 6"/>
          <path d="m9 9 6 6"/>
        </>
      }/>
    );

    const AlertCircleIcon = (props) => (
      <Icon {...props} path={
        <>
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </>
      }/>
    );

    const CheckIcon = (props) => (
      <Icon {...props} path={<polyline points="20 6 9 17 4 12"/>}/>
    );

    const XIcon = (props) => (
      <Icon {...props} path={
        <>
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </>
      }/>
    );

    const CopyIcon = (props) => (
      <Icon {...props} path={
        <>
          <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
          <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
        </>
      }/>
    );

    const ArrowRightIcon = (props) => (
      <Icon {...props} path={
        <>
          <line x1="5" y1="12" x2="19" y2="12"/>
          <polyline points="12 5 19 12 12 19"/>
        </>
      }/>
    );

    const ShieldCheckIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/>
          <path d="m9 12 2 2 4-4"/>
        </>
      }/>
    );

    const WandIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="m19 2 2 2-2 2-2-2Z"/>
          <path d="m5 16 2 2-2 2-2-2Z"/>
          <path d="m15 4-1 1"/>
          <path d="m14 7 3-3"/>
          <path d="M9.5 9.5 3 16l5 5 6.5-6.5"/>
          <path d="m14 14 6-6"/>
        </>
      }/>
    );

    const DownloadIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </>
      }/>
    );

    const RefreshCwIcon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
          <path d="M21 3v5h-5"/>
          <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
          <path d="M8 16H3v5"/>
        </>
      }/>
    );

    const StarIcon = (props) => (
      <Icon {...props} path={
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      }/>
    );

    const MenuIcon = (props) => (
      <Icon {...props} path={
        <>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
        </>
      }/>
    );

    const InfoIcon = (props) => (
      <Icon {...props} path={
        <>
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </>
      }/>
    );

    const Trash2Icon = (props) => (
      <Icon {...props} path={
        <>
          <path d="M3 6h18"/>
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/>
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          <line x1="10" y1="11" x2="10" y2="17"/>
          <line x1="14" y1="11" x2="14" y2="17"/>
        </>
      }/>
    );

    // --- Mock Data & Presets ---
    const SAMPLE_RESUME = {
      name: "Alex_Rivera_Senior_Frontend_Engineer.pdf",
      size: "184 KB",
      pages: 2,
      lastModified: "Updated 2 days ago",
      text: `ALEX RIVERA
Senior Frontend Engineer | San Francisco, CA | alex.rivera@example.com

SUMMARY
Passionate Senior Frontend Developer with 6+ years of experience building scalable, performant web applications with React, TypeScript, and modern JavaScript ecosystem. Proven track record leading UI architecture and mentoring junior developers.

EXPERIENCE
Senior Frontend Developer - TechNova Labs (2021 - Present)
- Led team of developers building responsive dashboard web applications using React, Next.js, and Redux Toolkit.
- Built reusable component library using Tailwind CSS and Storybook, increasing frontend team velocity.
- Improved application performance by optimizing re-renders and code-splitting, speeding up load times.
- Collaborated with product designers and backend engineers to define RESTful and GraphQL APIs.

Frontend Developer - CloudScale Systems (2018 - 2021)
- Developed customer-facing web portals with React, TypeScript, and HTML5/CSS3.
- Implemented unit and integration test suites using Jest and React Testing Library with 85% coverage.
- Participated in daily Agile standups, sprint planning, and bi-weekly retrospectives.

SKILLS
Languages: TypeScript, JavaScript (ES6+), HTML5, CSS3, SQL
Frameworks & Libraries: React, Next.js, Redux, Tailwind CSS, Jest, React Testing Library
Tools: Git, GitHub, Webpack, Vite, Figma, Agile / Scrum`
    };

    const SAMPLE_JOB_DESC = `Position: Senior Frontend Engineer (Core Platform)
Company: Stripe / Fintech Inc.
Location: Remote (US / Canada)

About the Role:
We are looking for an exceptional Senior Frontend Engineer to join our Core Platform team. In this role, you will architect enterprise-grade web applications, champion web performance, and collaborate with cross-functional teams to build intuitive, mission-critical financial interfaces.

Requirements & Qualifications:
- 5+ years of production experience building modern web applications with React and TypeScript.
- Deep expertise in state management (Redux, Zustand, or React Query) and responsive UI styling with Tailwind CSS.
- Strong knowledge of modern build tooling (Vite, Webpack), CI/CD pipelines, and automated testing (Jest, Cypress).
- Experience containerizing web apps with Docker and deploying to AWS (S3, CloudFront, ECS).
- Understanding of micro-frontend architecture and GraphQL API consumption is a strong plus.
- Proven ability to quantify engineering impact and mentor peers in an Agile / Scrum environment.`;

    // --- Main Application Component ---
    function App() {
      // Input states
      const [resumeFile, setResumeFile] = useState(SAMPLE_RESUME);
      const [jobDescription, setJobDescription] = useState(SAMPLE_JOB_DESC);
      const [isDragging, setIsDragging] = useState(false);
      
      // UI Flow states
      const [isAnalyzing, setIsAnalyzing] = useState(false);
      const [analyzeProgress, setAnalyzeProgress] = useState(0);
      const [statusStep, setStatusStep] = useState("");
      const [showResults, setShowResults] = useState(true); // default true for immediate preview as requested
      const [activeTab, setActiveTab] = useState("overview"); // "overview" | "keywords" | "formatting" | "feedback"
      
      // Toast notification state
      const [toast, setToast] = useState(null);

      // Modal states
      const [activeModal, setActiveModal] = useState(null); // 'howItWorks' | 'pricing' | 'signIn' | 'export' | null
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      const fileInputRef = useRef(null);
      const resultsRef = useRef(null);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Handle Drag & Drop
      const handleDragOver = (e) => {
        e.preventDefault();
        setIsDragging(true);
      };

      const handleDragLeave = (e) => {
        e.preventDefault();
        setIsDragging(false);
      };

      const handleDrop = (e) => {
        e.preventDefault();
        setIsDragging(false);
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          const file = e.dataTransfer.files[0];
          handleLoadedFile(file);
        }
      };

      const handleFileInputChange = (e) => {
        if (e.target.files && e.target.files.length > 0) {
          const file = e.target.files[0];
          handleLoadedFile(file);
        }
      };

      const handleLoadedFile = (file) => {
        const sizeInKB = Math.round(file.size / 1024);
        setResumeFile({
          name: file.name,
          size: `${sizeInKB} KB`,
          pages: 2,
          lastModified: "Uploaded just now",
          text: `[Parsed Content from ${file.name}]`
        });
        showToast(`Uploaded "${file.name}" successfully!`);
      };

      const removeResume = (e) => {
        e.stopPropagation();
        setResumeFile(null);
        if (fileInputRef.current) fileInputRef.current.value = "";
      };

      const loadSampleData = () => {
        setResumeFile(SAMPLE_RESUME);
        setJobDescription(SAMPLE_JOB_DESC);
        showToast("Pre-loaded Senior Frontend Engineer sample data!");
      };

      // Simulated Analysis Flow
      const runAnalysis = () => {
        if (!resumeFile) {
          showToast("Please upload a resume file first.", "error");
          return;
        }
        if (!jobDescription.trim()) {
          showToast("Please paste a target job description.", "error");
          return;
        }

        setIsAnalyzing(true);
        setAnalyzeProgress(0);
        setStatusStep("Reading document structure & formatting rules...");

        const steps = [
          { progress: 20, text: "Extracting skills, certifications & role history..." },
          { progress: 45, text: "Scanning 50+ ATS keyword vectors against target job..." },
          { progress: 70, text: "Benchmarking against Workday, Greenhouse & Lever algorithms..." },
          { progress: 90, text: "Synthesizing bullet point impact and readability score..." },
          { progress: 100, text: "Complete! Preparing your ATS Dashboard..." }
        ];

        let currentStep = 0;
        const interval = setInterval(() => {
          if (currentStep < steps.length) {
            setAnalyzeProgress(steps[currentStep].progress);
            setStatusStep(steps[currentStep].text);
            currentStep++;
          } else {
            clearInterval(interval);
            setTimeout(() => {
              setIsAnalyzing(false);
              setShowResults(true);
              showToast("Analysis Complete! 82% ATS Match Score calculated.");
              if (resultsRef.current) {
                resultsRef.current.scrollIntoView({ behavior: 'smooth' });
              }
            }, 500);
          }
        }, 550);
      };

      const copyBullet = (text, id) => {
        navigator.clipboard.writeText(text);
        showToast("Optimized bullet copied to clipboard!");
      };

      return (
        <div className="flex-1 flex flex-col font-sans">
          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 bg-slate-900 text-white rounded-xl shadow-2xl border border-slate-700/80 animate-fade-in transition-all">
              {toast.type === "error" ? (
                <AlertCircleIcon className="w-5 h-5 text-rose-400" />
              ) : (
                <CheckCircleIcon className="w-5 h-5 text-emerald-400" />
              )}
              <span className="text-sm font-medium">{toast.message}</span>
            </div>
          )}

          {/* 1. Header / Navigation */}
          <header className="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                {/* Logo */}
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-slate-900 via-blue-900 to-blue-600 flex items-center justify-center text-white shadow-md shadow-blue-500/10">
                    <SparklesIcon className="w-5 h-5 text-blue-300" />
                  </div>
                  <div>
                    <span className="text-xl font-black tracking-tight text-slate-900">Resume<span className="text-blue-600">AI</span></span>
                    <span className="hidden sm:inline-block ml-2 px-2 py-0.5 text-[10px] font-bold tracking-wide uppercase bg-blue-50 text-blue-700 rounded-full border border-blue-200">
                      ATS v4.2
                    </span>
                  </div>
                </div>

                {/* Desktop Nav Links */}
                <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-600">
                  <button 
                    onClick={() => setActiveModal('howItWorks')}
                    className="hover:text-blue-600 transition-colors cursor-pointer"
                  >
                    How it Works
                  </button>
                  <button 
                    onClick={() => setActiveModal('pricing')}
                    className="hover:text-blue-600 transition-colors cursor-pointer"
                  >
                    Pricing
                  </button>
                  <a 
                    href="#results-section" 
                    className="hover:text-blue-600 transition-colors"
                  >
                    Live Demo Score
                  </a>
                </nav>

                {/* Right Actions */}
                <div className="hidden md:flex items-center gap-3">
                  <button
                    onClick={() => setActiveModal('signIn')}
                    className="px-4 py-2 text-sm font-semibold text-slate-700 hover:text-slate-900 hover:bg-slate-100 rounded-lg transition-colors cursor-pointer"
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => {
                      loadSampleData();
                      showToast("Loaded sample profile! Click Analyze below.");
                    }}
                    className="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-white bg-slate-900 hover:bg-slate-800 rounded-lg shadow-sm hover:shadow transition-all cursor-pointer"
                  >
                    <SparklesIcon className="w-4 h-4 text-blue-400" />
                    <span>Try Demo</span>
                  </button>
                </div>

                {/* Mobile Menu Button */}
                <div className="flex md:hidden">
                  <button
                    onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                    className="p-2 rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 focus:outline-none"
                    aria-label="Toggle menu"
                  >
                    {mobileMenuOpen ? <XIcon className="w-6 h-6" /> : <MenuIcon className="w-6 h-6" />}
                  </button>
                </div>
              </div>
            </div>

            {/* Mobile Dropdown */}
            {mobileMenuOpen && (
              <div className="md:hidden border-b border-slate-200 bg-white px-4 pt-2 pb-4 space-y-2">
                <button
                  onClick={() => { setActiveModal('howItWorks'); setMobileMenuOpen(false); }}
                  className="block w-full text-left px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg"
                >
                  How it Works
                </button>
                <button
                  onClick={() => { setActiveModal('pricing'); setMobileMenuOpen(false); }}
                  className="block w-full text-left px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 rounded-lg"
                >
                  Pricing
                </button>
                <div className="pt-2 border-t border-slate-100 flex flex-col gap-2">
                  <button
                    onClick={() => { setActiveModal('signIn'); setMobileMenuOpen(false); }}
                    className="w-full text-center py-2 text-sm font-semibold text-slate-700 hover:bg-slate-50 rounded-lg"
                  >
                    Sign In
                  </button>
                  <button
                    onClick={() => { loadSampleData(); setMobileMenuOpen(false); }}
                    className="w-full text-center py-2 text-sm font-semibold text-white bg-slate-900 rounded-lg"
                  >
                    Load Sample Data
                  </button>
                </div>
              </div>
            )}
          </header>

          <main className="flex-1">
            {/* 2. Hero Section */}
            <section className="relative overflow-hidden pt-12 pb-16 lg:pt-20 lg:pb-24 border-b border-slate-200/80 bg-gradient-to-b from-white via-slate-50/50 to-slate-100/70">
              {/* Subtle background glow */}
              <div className="absolute top-0 left-1/2 -translate-x-1/2 w-full max-w-7xl h-96 bg-gradient-to-tr from-blue-100/40 via-indigo-100/20 to-transparent blur-3xl pointer-events-none -z-10" />

              <div className="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
                {/* Pill Badge */}
                <div className="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-blue-50 border border-blue-200/80 shadow-xs mb-6">
                  <span className="flex h-2 w-2 rounded-full bg-blue-600 animate-pulse"></span>
                  <span className="text-xs font-semibold text-blue-900">AI-Powered ATS Algorithm 2026 Ready</span>
                  <span className="text-slate-300">|</span>
                  <span className="text-xs text-blue-700 font-medium">Over 240,000+ Resumes Optimized</span>
                </div>

                {/* Primary Headline */}
                <h1 className="text-4xl sm:text-5xl lg:text-6xl font-extrabold text-slate-900 tracking-tight leading-[1.15] mb-6">
                  Beat the ATS. <span className="bg-gradient-to-r from-blue-700 via-indigo-600 to-blue-500 bg-clip-text text-transparent">Land the Interview.</span>
                </h1>

                {/* Subheadline */}
                <p className="max-w-2xl mx-auto text-lg sm:text-xl text-slate-600 leading-relaxed mb-8">
                  Upload your resume and the target job description. Our AI analyzes keyword match, formatting, and impact to give you an instant ATS compatibility score.
                </p>

                {/* Quick Action helper */}
                <div className="flex flex-wrap items-center justify-center gap-4 text-xs sm:text-sm text-slate-500">
                  <div className="flex items-center gap-1.5">
                    <ShieldCheckIcon className="w-4 h-4 text-emerald-600" />
                    <span>Compatible with Workday, Greenhouse & Lever</span>
                  </div>
                  <span className="hidden sm:inline text-slate-300">•</span>
                  <div className="flex items-center gap-1.5">
                    <CheckCircleIcon className="w-4 h-4 text-blue-600" />
                    <span>100% Confidential & Private</span>
                  </div>
                  <span className="hidden sm:inline text-slate-300">•</span>
                  <button 
                    onClick={loadSampleData} 
                    className="text-blue-600 font-semibold hover:underline inline-flex items-center gap-1 cursor-pointer"
                  >
                    <span>Click to load demo profile</span>
                    <ArrowRightIcon className="w-3.5 h-3.5" />
                  </button>
                </div>
              </div>
            </section>

            {/* 3. Main Interactive Area (Input Section) */}
            <section className="py-12 lg:py-16 bg-slate-50">
              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                
                {/* Section Header */}
                <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-8 pb-4 border-b border-slate-200">
                  <div>
                    <h2 className="text-2xl font-bold text-slate-900 tracking-tight">Step 1: Input Profile & Target Role</h2>
                    <p className="text-sm text-slate-500 mt-1">Provide your current resume and the position requirements for instant comparative audit.</p>
                  </div>
                  <div className="mt-3 sm:mt-0 flex items-center gap-2">
                    <button
                      onClick={loadSampleData}
                      className="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 hover:bg-blue-100 border border-blue-200 rounded-lg transition-colors cursor-pointer"
                      title="Load sample Senior Frontend role and resume"
                    >

                    <svg className="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
                    <span>Continue with Google</span>
                  </button>

                  <button 
                    onClick={() => { setActiveModal(null); showToast("Signed in successfully with GitHub!"); }}
                    className="w-full py-2.5 px-4 text-xs font-semibold text-white bg-slate-900 rounded-lg hover:bg-slate-800 flex items-center justify-center gap-2"
                  >
                    <span>Continue with GitHub</span>
                  </button>
                </div>

                <div className="mt-4 pt-4 border-t border-slate-100">
                  <button 
                    onClick={() => setActiveModal(null)} 
                    className="text-xs text-slate-400 hover:text-slate-600"
                  >
                    Continue as Guest
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Export Report Modal */}
          {activeModal === 'export' && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fade-in">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex items-center justify-between pb-3 border-b border-slate-100">
                  <div className="flex items-center gap-2">
                    <DownloadIcon className="w-5 h-5 text-blue-600" />
                    <h3 className="font-bold text-slate-900 text-base">Export ATS Audit Report</h3>
                  </div>
                  <button onClick={() => setActiveModal(null)} className="p-1 text-slate-400 hover:text-slate-700">
                    <XIcon className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-3 text-xs text-slate-600">
                  <div className="p-3 bg-slate-50 rounded-lg border border-slate-200">
                    <div className="font-bold text-slate-800 mb-1">ResumeAI Comprehensive Audit Summary</div>
                    <div>Candidate: Alex Rivera • Target: Senior Frontend Engineer</div>
                    <div className="font-semibold text-emerald-700 mt-1">Score: 82% (High ATS Compatibility)</div>
                  </div>
                  <p>Included in report:</p>
                  <ul className="space-y-1 list-disc list-inside text-slate-500">
                    <li>Complete keyword density comparison</li>
                    <li>6-point ATS formatting audit breakdown</li>
                    <li>3 prioritized AI bullet point rewrites</li>
                    <li>Workday & Greenhouse parsing validation checklist</li>
                  </ul>
                </div>

                <div className="pt-3 border-t border-slate-100 flex items-center justify-end gap-3">
                  <button 
                    onClick={() => setActiveModal(null)} 
                    className="px-4 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-100 rounded-lg"
                  >
                    Cancel
                  </button>
                  <button 
                    onClick={() => {
                      setActiveModal(null);
                      window.print();
                    }} 
                    className="inline-flex items-center gap-1.5 px-4 py-2 text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm"
                  >
                    <DownloadIcon className="w-3.5 h-3.5" />
                    <span>Download / Print PDF</span>
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Mount React App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
